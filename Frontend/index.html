<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CaapMedia - Plateforme Commerciale</title>
  <link rel="icon" type="image/png" href="/CaaMedia.png">
  <link rel="apple-touch-icon" href="/CaaMedia.png">
  <script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
        font-family: 'Montserrat', sans-serif;
    }
    /* Scrollbar globale: fine et gris clair (meme gris que border-slate-300,
       deja utilise partout dans l'app). */
    * {
      scrollbar-width: thin;
      scrollbar-color: #cbd5e1 transparent;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .animate-slideDown {
      animation: slideDown 0.15s ease-out;
    }

    @keyframes blink {
      50% {
        opacity: 0.7;
        transform: scale(0.98);
      }
    }
    .animate-blink {
      animation: blink 1.3s ease-in-out infinite;
    }
    
    /* New styles for the slide-out category menu */
    @keyframes slideIn {
      from { transform: translateX(-100%); }
      to { transform: translateX(0); }
    }
    @keyframes slideOut {
      from { transform: translateX(0); }
      to { transform: translateX(-100%); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes fadeOut {
      from { opacity: 1; }
      to { opacity: 0; }
    }

    .category-menu-overlay {
      animation: fadeIn 0.3s ease-out forwards;
    }
    .category-menu-overlay.closing {
      animation: fadeOut 0.3s ease-in forwards;
    }
    .category-menu {
      animation: slideIn 0.3s ease-out forwards;
    }
    .category-menu.closing {
      animation: slideOut 0.3s ease-in forwards;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    @media print {
      body {
        background-color: white !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .no-print {
        display: none !important;
      }
      main {
        padding: 0 !important;
        margin: 0 !important;
        overflow: visible !important;
      }
      .printable-area {
        box-shadow: none !important;
        border: none !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      table {
        width: 100% !important;
        border-collapse: collapse !important;
      }
      th, td {
          border: 1px solid #ccc !important;
          padding: 8px !important;
      }
      .bg-white, .bg-slate-50, .bg-green-100, .bg-yellow-100, .bg-red-100, .bg-blue-100, .bg-purple-100, .bg-gray-100, .bg-sky-100 {
        background-color: white !important;
      }
      .text-green-800, .text-yellow-800, .text-red-800, .text-blue-800, .text-purple-800, .text-gray-800, .text-sky-800 {
        color: black !important;
      }

      body > div[class*="fixed"] {
        display: none !important;
      }
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/": "https://esm.sh/react@18.3.1/",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/": "https://esm.sh/react-dom@18.3.1/",
    "@google/genai": "https://esm.sh/@google/genai@0.14.0",
    "recharts": "https://esm.sh/recharts@2.12.7?bundle",
    "recharts/": "https://esm.sh/recharts@2.12.7/?bundle",
    "jspdf": "https://esm.sh/jspdf@2.5.1",
    "jspdf-autotable": "https://esm.sh/jspdf-autotable@3.8.2",
    "html2canvas": "https://esm.sh/html2canvas@1.4.1"
  }
}
</script>
</head>
<body class="bg-gray-100 antialiased">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
