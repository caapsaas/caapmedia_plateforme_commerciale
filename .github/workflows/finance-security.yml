name: Finance security

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  authorization:
    name: Finance authorization tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run test:finance-security
